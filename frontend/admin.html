<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6a829" />
    <title>DJ System Admin</title>
    <link rel="stylesheet" href="styles/admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <h1>DJ System</h1>
          <p>Admin</p>
        </div>
        <button id="logoutButton" class="text-button" type="button" hidden>
          Logout
        </button>
      </header>

      <section id="loginPanel" class="admin-card login-card">
        <h2>Administrator Login</h2>
        <form id="loginForm" class="login-form">
          <label for="passwordInput">Admin Password</label>
          <input
            id="passwordInput"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            required
          />
          <button type="submit">Login</button>
        </form>
        <p id="loginMessage" class="message" role="status"></p>
      </section>

      <div id="dashboard" class="dashboard" hidden>
        <section class="admin-card">
          <div class="section-heading">
            <div>
              <h2>System</h2>
              <p id="systemStatus" class="system-status"></p>
            </div>
            <button id="toggleSystemButton" type="button">Loading...</button>
          </div>
          <p id="settingsMessage" class="message" role="status"></p>

          <form id="requestPasswordChangeForm" class="password-change-form">
            <h3>Request Password</h3>
            <p id="requestPasswordStatus" class="message"></p>
            <input
              id="newRequestPasswordInput"
              type="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="New password"
              minlength="4"
              required
            />
            <button type="submit">Update Password</button>
          </form>
        </section>
      </div>
    </main>

    <script src="scripts/admin.js" type="module"></script>
  </body>
</html>
